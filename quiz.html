<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>脳タイプIQテスト（20問）| AI-KNOW</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{background:radial-gradient(800px 400px at 50% -10%,rgba(79,163,255,.18),transparent 60%),var(--ice-2);min-height:100vh}
.qhd{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.qhd .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.timer{display:flex;align-items:center;gap:8px;font-family:var(--num);font-weight:800;font-size:18px;color:var(--navy);background:var(--ice);padding:6px 14px;border-radius:999px}
.timer.warn{color:#fff;background:var(--red)}
.timer svg{width:18px;height:18px}
.prog{height:4px;background:var(--ice)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--sky));transition:width .4s}

.stage{width:min(760px,100% - 32px);margin:36px auto 60px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:34px 32px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.qnum{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qnum b{font-family:var(--num);font-size:13px;color:var(--blue);letter-spacing:.14em}
.qnum span{font-size:12px;color:var(--sub);background:var(--ice);padding:2px 10px;border-radius:999px;font-weight:700}
.prompt{font-size:21px;font-weight:900;color:var(--navy);line-height:1.5;margin-bottom:22px}

.stem{display:grid;gap:10px;margin:0 auto 26px}
.stem.seq{grid-template-columns:repeat(5,1fr);max-width:560px}
.stem.matrix{grid-template-columns:repeat(3,1fr);max-width:360px}
.stem.single{grid-template-columns:1fr;max-width:160px}
.stem.row3{grid-template-columns:repeat(3,1fr);max-width:400px}
.stem.row4{grid-template-columns:repeat(4,1fr);max-width:520px}
.stem.grid9{grid-template-columns:repeat(3,1fr);max-width:360px}
.stem .fig{background:var(--ice);border-radius:14px}
.stem .fig.q{background:#fff;outline:2px dashed var(--sky);outline-offset:-2px}
.stem .fig.blank{background:transparent}

.hidden-note{text-align:center;color:var(--sub);font-size:14px;margin:-10px 0 20px;min-height:22px}
.mem-cover{display:grid;place-items:center;height:160px;background:var(--ice);border-radius:14px;color:var(--navy);font-weight:800;margin-bottom:26px}
.mem-cover .cnt{font-family:var(--num);font-size:40px;color:var(--blue)}

.opts{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.opts button{position:relative;aspect-ratio:1;background:var(--ice-2);border:2px solid var(--line);border-radius:14px;padding:6px;transition:.15s}
.opts button:hover{border-color:var(--sky);transform:translateY(-2px)}
.opts button.sel{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(30,79,216,.18)}
.opts button svg{width:100%;height:100%}
.opts button i{position:absolute;left:6px;top:4px;font-family:var(--num);font-style:normal;font-size:11px;font-weight:800;color:var(--sub)}
.opts.lock button{pointer-events:none;opacity:.35}
@media(max-width:600px){.opts{grid-template-columns:repeat(3,1fr)}.qcard{padding:24px 18px}.prompt{font-size:18px}.stem.seq{grid-template-columns:repeat(5,1fr)}}

.foot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;font-size:13px;color:var(--sub)}
.foot .skip{color:var(--sub);text-decoration:underline}

/* intro */
.intro{text-align:center;padding:48px 32px}
.intro h1{font-size:30px;font-weight:900;color:var(--navy);margin:10px 0 12px}
.intro p{color:var(--sub);max-width:30em;margin:0 auto}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}
.rules div{background:var(--ice);border-radius:14px;padding:16px 10px}
.rules b{display:block;font-family:var(--num);font-size:26px;color:var(--blue)}
.rules span{font-size:13px;color:var(--sub);font-weight:700}
@media(max-width:600px){.rules{grid-template-columns:1fr}}

/* analyzing */
.anal{text-align:center;padding:60px 24px}
.ring{width:110px;height:110px;margin:0 auto 24px;border-radius:50%;border:8px solid var(--ice);border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.anal h2{color:var(--navy);font-size:24px;margin-bottom:8px}
.anal p{color:var(--sub);min-height:28px}
</style>
</head>
<body>
<div class="qhd">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a4 4 0 0 1 4 4v1a4 4 0 0 1 2 7v1a4 4 0 0 1-6 3.5A4 4 0 0 1 6 16v-1a4 4 0 0 1 2-7V7a4 4 0 0 1 4-4z"/><path d="M12 3v18"/></svg></span>AI-KNOW</a>
    <div class="timer" id="timer" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span id="tm">10:00</span></div>
  </div>
  <div class="prog"><i id="prog" style="width:0%"></i></div>
</div>

<main class="stage" id="stage"></main>

<script src="figures.js"></script>
<script>
/* ===================== 問題データ（planning.md §3 が正） ===================== */
var B='blue',N='navy',S='sky',G='gold';
function F(shape,o){return Object.assign({shape:shape,color:B,fill:'solid'},o||{});}
var Q={question:true};

var QUESTIONS=[
/* ---- A 系列推理 ---- */
{id:1,domain:'A',w:1,layout:'seq',prompt:'？に入る図形はどれ？',
 stem:[F('circle'),F('square'),F('triangle'),F('circle'),Q],
 options:[F('square'),F('circle'),F('triangle'),F('diamond'),F('star'),F('hexagon')],answer:2},
{id:2,domain:'A',w:1,layout:'seq',prompt:'？に入る図形はどれ？',
 stem:[F('arrow',{rot:0}),F('arrow',{rot:45}),F('arrow',{rot:90}),F('arrow',{rot:135}),Q],
 options:[F('arrow',{rot:90}),F('arrow',{rot:225}),F('arrow',{rot:0}),F('arrow',{rot:180}),F('arrow',{rot:135}),F('arrow',{rot:270})],answer:3},
{id:3,domain:'A',w:2,layout:'seq',prompt:'？に入る図形はどれ？',
 stem:[F('circle',{size:'s'}),F('circle',{size:'m'}),F('circle',{size:'l'}),F('square',{size:'s',color:N}),Q],
 options:[F('square',{size:'l',color:N}),F('circle',{size:'m',color:N}),F('square',{size:'m',color:B}),F('square',{size:'m',color:N}),F('triangle',{size:'m',color:N}),F('square',{size:'s',color:N})],answer:3},
{id:4,domain:'A',w:2,layout:'seq',prompt:'？に入る図形はどれ？',
 stem:[F('circle',{fill:'solid'}),F('square',{fill:'empty'}),F('circle',{fill:'half'}),F('square',{fill:'solid'}),Q],
 options:[F('square',{fill:'empty'}),F('circle',{fill:'half'}),F('circle',{fill:'solid'}),F('square',{fill:'half'}),F('circle',{fill:'empty'}),F('triangle',{fill:'empty'})],answer:4},

/* ---- B 行列推理 ---- */
{id:5,domain:'B',w:1,layout:'matrix',prompt:'右下の？に入る図形はどれ？',
 stem:[F('circle',{color:B}),F('circle',{color:S}),F('circle',{color:G}),
       F('square',{color:B}),F('square',{color:S}),F('square',{color:G}),
       F('triangle',{color:B}),F('triangle',{color:S}),Q],
 options:[F('triangle',{color:B}),F('circle',{color:G}),F('triangle',{color:G}),F('square',{color:G}),F('triangle',{color:S}),F('diamond',{color:G})],answer:2},
{id:6,domain:'B',w:2,layout:'matrix',prompt:'右下の？に入る図形はどれ？',
 stem:[F('star',{count:1,color:G}),F('star',{count:2,color:G}),F('star',{count:3,color:G}),
       F('diamond',{count:1}),F('diamond',{count:2}),F('diamond',{count:3}),
       F('hexagon',{count:1,color:N}),F('hexagon',{count:2,color:N}),Q],
 options:[F('hexagon',{count:2,color:N}),F('hexagon',{count:4,color:N}),F('star',{count:3,color:N}),F('hexagon',{count:1,color:N}),F('hexagon',{count:3,color:N}),F('circle',{count:3,color:N})],answer:4},
{id:7,domain:'B',w:2,layout:'matrix',prompt:'右下の？に入る図形はどれ？',
 stem:[F('circle',{fill:'solid'}),F('square',{fill:'solid'}),F('triangle',{fill:'solid'}),
       F('square',{fill:'empty'}),F('triangle',{fill:'empty'}),F('circle',{fill:'empty'}),
       F('triangle',{fill:'half'}),F('circle',{fill:'half'}),Q],
 options:[F('square',{fill:'solid'}),F('square',{fill:'half'}),F('square',{fill:'empty'}),F('triangle',{fill:'half'}),F('circle',{fill:'half'}),F('diamond',{fill:'half'})],answer:1},
{id:8,domain:'B',w:3,layout:'matrix',prompt:'右下の？に入る図形はどれ？',
 stem:[F('arrow',{rot:0,color:N}),F('arrow',{rot:90,color:N}),F('arrow',{rot:180,color:N}),
       F('arrow',{rot:90,color:N}),F('arrow',{rot:180,color:N}),F('arrow',{rot:270,color:N}),
       F('arrow',{rot:180,color:N}),F('arrow',{rot:270,color:N}),Q],
 options:[F('arrow',{rot:270,color:N}),F('arrow',{rot:90,color:N}),F('arrow',{rot:180,color:N}),F('arrow',{rot:45,color:N}),F('arrow',{rot:0,color:N}),F('arrow',{rot:135,color:N})],answer:4},
{id:9,domain:'B',w:3,layout:'matrix',prompt:'右下の？に入る図形はどれ？',
 stem:[F('square',{fill:'empty',color:N,inner:F('circle',{color:B})}),F('square',{fill:'empty',color:N,inner:F('triangle',{color:G})}),F('square',{fill:'empty',color:N,inner:F('star',{color:S})}),
       F('circle',{fill:'empty',color:N,inner:F('circle',{color:B})}),F('circle',{fill:'empty',color:N,inner:F('triangle',{color:G})}),F('circle',{fill:'empty',color:N,inner:F('star',{color:S})}),
       F('hexagon',{fill:'empty',color:N,inner:F('circle',{color:B})}),F('hexagon',{fill:'empty',color:N,inner:F('triangle',{color:G})}),Q],
 options:[F('hexagon',{fill:'empty',color:N,inner:F('star',{color:G})}),F('hexagon',{fill:'empty',color:N,inner:F('triangle',{color:S})}),F('circle',{fill:'empty',color:N,inner:F('star',{color:S})}),F('hexagon',{fill:'empty',color:N,inner:F('star',{color:S})}),F('hexagon',{fill:'empty',color:N,inner:F('circle',{color:S})}),F('hexagon',{fill:'empty',color:N,inner:F('star',{color:B})})],answer:3},

/* ---- C 空間・回転 ---- */
{id:10,domain:'C',w:1,layout:'single',prompt:'左の図形を回転させたものはどれ？（裏返しは不可）',
 stem:[F('flag',{color:B})],
 options:[F('flag',{mirror:true}),F('flag',{mirror:true,rot:90}),F('flag',{rot:90}),F('lshape',{rot:90}),F('flag',{mirror:true,rot:180}),F('flag',{mirror:true,rot:270})],answer:2},
{id:11,domain:'C',w:2,layout:'single',prompt:'左の図形を鏡に映したものはどれ？',
 stem:[F('lshape',{color:N})],
 options:[F('lshape',{color:N,rot:90}),F('lshape',{color:N,rot:180}),F('lshape',{color:N,mirror:true}),F('lshape',{color:N,rot:270}),F('lshape',{color:N}),F('flag',{color:N,mirror:true})],answer:2},
{id:12,domain:'C',w:2,layout:'none',prompt:'仲間はずれはどれ？（1つだけ裏返っています）',
 stem:[],
 options:[F('flag',{color:S,rot:0}),F('flag',{color:S,rot:60}),F('flag',{color:S,rot:120}),F('flag',{color:S,rot:180,mirror:true}),F('flag',{color:S,rot:240}),F('flag',{color:S,rot:300})],answer:3},
{id:13,domain:'C',w:3,layout:'single',prompt:'左の図形を180度回転させたものはどれ？',
 stem:[F('lshape',{color:B,inner:F('triangle',{color:G})})],
 options:[F('lshape',{color:B,rot:180,mirror:true,inner:F('triangle',{color:G})}),F('lshape',{color:B,rot:90,inner:F('triangle',{color:G})}),F('lshape',{color:B,rot:180,inner:F('triangle',{color:G})}),F('lshape',{color:B,rot:180,inner:F('triangle',{color:G,rot:180})}),F('lshape',{color:B,mirror:true,inner:F('triangle',{color:G})}),F('lshape',{color:B,rot:270,inner:F('triangle',{color:G})})],answer:2},

/* ---- D 数量・規則 ---- */
{id:14,domain:'D',w:1,layout:'row4',prompt:'？に入る図形はどれ？',
 stem:[F('circle',{count:1}),F('circle',{count:2}),F('circle',{count:3}),Q],
 options:[F('circle',{count:3}),F('circle',{count:2}),F('circle',{count:4}),F('circle',{count:1}),F('star',{count:4}),F('square',{count:4})],answer:2},
{id:15,domain:'D',w:2,layout:'row4',prompt:'？に入る図形はどれ？',
 stem:[{items:[F('circle'),F('square',{color:G}),F('square',{color:G}),F('square',{color:G})]},
       {items:[F('circle'),F('circle'),F('square',{color:G}),F('square',{color:G})]},
       {items:[F('circle'),F('circle'),F('circle'),F('square',{color:G})]},Q],
 options:[{items:[F('circle'),F('circle'),F('circle'),F('square',{color:G})]},{items:[F('square',{color:G}),F('square',{color:G}),F('square',{color:G}),F('square',{color:G})]},{items:[F('circle'),F('circle'),F('square',{color:G}),F('square',{color:G})]},{items:[F('circle'),F('circle'),F('circle'),F('circle')]},{items:[F('circle'),F('circle'),F('circle'),F('star',{color:G})]},{items:[F('circle'),F('circle'),F('circle')]}],answer:3},
{id:16,domain:'D',w:2,layout:'matrix',prompt:'左の2つを合わせると右になります。右下の？に入る図形はどれ？',
 stem:[F('hexagon',{count:1,color:N}),F('hexagon',{count:1,color:N}),F('hexagon',{count:2,color:N}),
       F('hexagon',{count:1,color:N}),F('hexagon',{count:2,color:N}),F('hexagon',{count:3,color:N}),
       F('hexagon',{count:2,color:N}),F('hexagon',{count:2,color:N}),Q],
 options:[F('hexagon',{count:3,color:N}),F('hexagon',{count:2,color:N}),F('hexagon',{count:4,color:N}),F('hexagon',{count:1,color:N}),F('circle',{count:4,color:N}),F('hexagon',{count:3,color:G})],answer:2},
{id:17,domain:'D',w:3,layout:'row4',prompt:'？に入る図形はどれ？',
 stem:[F('circle',{fill:'quarter',color:B}),F('circle',{fill:'half',color:G}),F('circle',{fill:'threeq',color:B}),Q],
 options:[F('circle',{fill:'solid',color:B}),F('circle',{fill:'empty',color:G}),F('circle',{fill:'threeq',color:G}),F('circle',{fill:'solid',color:G}),F('circle',{fill:'half',color:G}),F('circle',{fill:'quarter',color:B})],answer:3},

/* ---- E ワーキングメモリ（刺激3秒表示→非表示） ---- */
{id:18,domain:'E',w:2,layout:'row3',memory:true,prompt:'真ん中にあった図形はどれ？',
 stem:[F('star',{color:G}),F('circle',{color:B}),F('square',{color:N})],
 options:[F('circle',{color:N}),F('star',{color:G}),F('circle',{color:B}),F('square',{color:N}),F('circle',{color:G}),F('triangle',{color:B})],answer:2},
{id:19,domain:'E',w:3,layout:'row4',memory:true,prompt:'左から3番目にあった図形はどれ？',
 stem:[F('arrow',{rot:270,color:B}),F('hexagon',{color:G}),F('cross',{color:N}),F('diamond',{color:S})],
 options:[F('cross',{color:B}),F('hexagon',{color:G}),F('cross',{color:N}),F('diamond',{color:S}),F('arrow',{rot:270,color:B}),F('cross',{color:N,rot:45})],answer:2},
{id:20,domain:'E',w:3,layout:'grid9',memory:true,prompt:'右上にあった図形はどれ？',
 stem:[F('star',{color:G}),null,F('circle',{color:S}),null,F('square',{color:B}),null,F('triangle',{color:N}),null,F('hexagon',{color:G})],
 options:[F('circle',{color:B}),F('star',{color:G}),F('hexagon',{color:G}),F('circle',{color:S}),F('square',{color:B}),F('triangle',{color:N})],answer:3}
];

var DOMAIN_NAME={A:'系列推理',B:'行列推理',C:'空間・回転',D:'数量・規則',E:'ワーキングメモリ'};
var LIMIT=600; // 秒

/* ===================== 進行 ===================== */
var stage=document.getElementById('stage'),timerEl=document.getElementById('timer'),tmEl=document.getElementById('tm'),progEl=document.getElementById('prog');
var idx=0,answers=[],timeLeft=LIMIT,tick=null,started=false;

function intro(){
  stage.innerHTML='<div class="qcard intro">'+
    '<span class="eyebrow">AI-KNOW</span><h1>脳タイプIQテスト</h1>'+
    '<p>言葉を使わない図形問題です。6つの選択肢から1つを選ぶと次の問題に進みます。最後の3問は図形が数秒で消えるので、よく見てから答えてください。</p>'+
    '<div class="rules"><div><b>20</b><span>問</span></div><div><b>10:00</b><span>制限時間（全体）</span></div><div><b>6</b><span>択・1問ずつ</span></div></div>'+
    '<button class="btn btn-primary" id="start">テストを始める <span class="arr">→</span></button>'+
    '<p style="font-size:12px;margin-top:16px">結果は心理測定上の標準化を行っていない推定値です。</p></div>';
  document.getElementById('start').onclick=start;
}
function start(){
  started=true;timerEl.hidden=false;
  tick=setInterval(function(){
    timeLeft--;fmt();
    if(timeLeft<=60)timerEl.classList.add('warn');
    if(timeLeft<=0){clearInterval(tick);finish();}
  },1000);
  fmt();show();
}
function fmt(){var m=Math.floor(timeLeft/60),s=timeLeft%60;tmEl.textContent=m+':'+(s<10?'0':'')+s;}

function show(){
  var q=QUESTIONS[idx];
  progEl.style.width=(idx/QUESTIONS.length*100)+'%';
  var h='<div class="qcard"><div class="qnum"><b>QUESTION '+(idx+1)+' / '+QUESTIONS.length+'</b><span>'+DOMAIN_NAME[q.domain]+'</span></div>';
  h+='<div class="prompt" id="prompt">'+(q.memory?'図形の並びを覚えてください':q.prompt)+'</div>';
  if(q.layout!=='none'){
    h+='<div class="stem '+q.layout+'" id="stem">'+q.stem.map(function(s){
      if(s===null)return '<div class="fig blank"></div>';
      return '<div class="fig'+(s.question?' q':'')+'">'+drawFigure(s)+'</div>';}).join('')+'</div>';
  }
  if(q.memory)h+='<div class="mem-cover" id="cover" hidden><div>図形は消えました<div class="cnt">?</div></div></div>';
  h+='<div class="opts'+(q.memory?' lock':'')+'" id="opts">'+q.options.map(function(o,i){return '<button data-i="'+i+'"><i>'+(i+1)+'</i>'+drawFigure(o)+'</button>';}).join('')+'</div>';
  h+='<div class="foot"><span>キーボードの 1〜6 でも選べます</span><button class="skip" id="skip">わからないので次へ</button></div></div>';
  stage.innerHTML=h;
  var opts=document.getElementById('opts');
  opts.querySelectorAll('button').forEach(function(b){b.onclick=function(){pick(+b.dataset.i,b);};});
  document.getElementById('skip').onclick=function(){pick(-1);};
  if(q.memory){
    setTimeout(function(){
      var st=document.getElementById('stem');if(st)st.remove();
      var cv=document.getElementById('cover');if(cv)cv.hidden=false;
      document.getElementById('prompt').textContent=q.prompt;
      opts.classList.remove('lock');
    },3000);
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
function pick(i,btn){
  if(btn)btn.classList.add('sel');
  answers[idx]=i;
  setTimeout(function(){idx++;if(idx>=QUESTIONS.length)finish();else show();},btn?220:0);
}
document.addEventListener('keydown',function(e){
  if(!started||idx>=QUESTIONS.length)return;
  var n=parseInt(e.key,10);if(n>=1&&n<=6){var b=document.querySelector('#opts:not(.lock) button[data-i="'+(n-1)+'"]');if(b)b.click();}
});

/* ===================== 採点（planning.md §4） ===================== */
function erf(x){var s=x<0?-1:1;x=Math.abs(x);var t=1/(1+.3275911*x);var y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return s*y;}
function finish(){
  clearInterval(tick);idx=QUESTIONS.length;progEl.style.width='100%';
  var raw=0,max=0,dom={A:[0,0],B:[0,0],C:[0,0],D:[0,0],E:[0,0]};
  QUESTIONS.forEach(function(q,i){
    max+=q.w;dom[q.domain][1]+=q.w;
    if(answers[i]===q.answer){raw+=q.w;dom[q.domain][0]+=q.w;}
  });
  var bonus=Math.min(3,Math.floor(Math.max(0,timeLeft)/150));
  var score=raw+bonus,total=max+3;
  var iq=Math.round(70+score/total*75);
  var pct=Math.round((0.5*(1+erf((iq-100)/15/Math.SQRT2)))*100);
  var d={};for(var k in dom)d[k]=dom[k][1]?dom[k][0]/dom[k][1]:0;
  var type=brainType(d,timeLeft);
  localStorage.setItem('aiknow_iq_result',JSON.stringify({iq:iq,pct:pct,raw:raw,max:max,bonus:bonus,timeLeft:timeLeft,domains:d,type:type,answers:answers,at:new Date().toISOString()}));
  analyzing();
}
function brainType(d,t){
  var vals=['A','B','C','D','E'].map(function(k){return d[k];});
  var m=vals.reduce(function(a,b){return a+b;},0)/5;
  var mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals);
  if(t>=300&&m>=0.5)return 'sprinter';
  if(mx-mn<=0.25)return 'balancer';
  var top=['A','B','C','D','E'].filter(function(k){return d[k]===mx;})[0];
  return {A:'pattern',B:'pattern',C:'spatial',D:'logic',E:'memory'}[top];
}
function analyzing(){
  timerEl.hidden=true;
  var msgs=['回答パターンを解析しています','5つの思考領域を集計しています','分布と照合しています','脳タイプを判定しています'];
  stage.innerHTML='<div class="qcard anal"><div class="ring"></div><h2>解析中</h2><p id="am">'+msgs[0]+'</p></div>';
  var i=0;var iv=setInterval(function(){i++;if(i<msgs.length)document.getElementById('am').textContent=msgs[i];else{clearInterval(iv);location.href='result.html';}},900);
}
intro();
