<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IQテスト（40問）| AI-KNOW</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{background:#fff;min-height:100vh}
.qhd{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.qhd .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.timer{display:flex;align-items:center;gap:8px;font-family:var(--num);font-weight:800;font-size:18px;color:var(--navy);background:var(--ice);padding:6px 14px;border-radius:999px}
.timer.warn{color:#fff;background:var(--red)}
.timer svg{width:18px;height:18px}
.prog{height:4px;background:var(--ice)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--sky));transition:width .4s}

.stage{width:min(820px,100% - 32px);margin:28px auto 70px}
.part{display:flex;justify-content:center;gap:10px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--sub)}
.part .chip{background:var(--ice);color:var(--blue);font-weight:700;padding:3px 12px;border-radius:999px;font-size:12px}
.part .lv{display:inline-flex;gap:3px}
.part .lv i{width:7px;height:7px;border-radius:50%;background:#d7deee}
.part .lv i.on{background:var(--blue)}
.prompt{font-size:21px;font-weight:700;color:var(--ink);line-height:1.6;margin-bottom:22px;text-align:center}
.prompt.left{text-align:left}
.prompt em{font-style:italic}

.mat{display:grid;grid-template-columns:repeat(3,1fr);width:min(380px,100%);margin:0 auto 10px;border:4px solid #111;background:#111;gap:3px}
.mat div{background:#fff;aspect-ratio:1;padding:6%}
.mat svg{width:100%;height:100%}
.sel-lbl{text-align:center;font-size:20px;color:var(--ink);margin:14px 0 12px}
.fopts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fopts button{border:2px solid #dfe6f3;border-radius:10px;background:#fff;padding:10px 8px 6px;transition:.15s;position:relative}
.fopts button:hover{border-color:var(--sky);transform:translateY(-2px)}
.fopts button.sel{border-color:var(--blue);box-shadow:0 0 0 4px rgba(30,79,216,.16)}
.fopts button b{display:block;font-family:var(--num);font-size:20px;font-weight:800;color:#111;margin-bottom:2px}
.fopts button svg{width:62%;height:auto;margin:0 auto;display:block}
@media(max-width:560px){.fopts{gap:8px}.fopts button svg{width:80%}}

.topts{display:grid;gap:10px;max-width:720px;margin:0 auto}
.topts button{text-align:left;border:1px solid #c9d3e6;border-radius:8px;background:#fff;padding:16px 18px;font-size:17px;line-height:1.6;color:var(--ink);transition:.12s;display:flex;gap:12px;align-items:flex-start}
.topts button b{font-family:var(--num);color:var(--blue);font-weight:800;flex:0 0 18px}
.topts button:hover{border-color:var(--sky);background:var(--ice-2)}
.topts button.sel{border-color:var(--blue);background:#E6F4EA}
.fopts.lock button,.topts.lock button{pointer-events:none;opacity:.35}

.stim{text-align:center;margin:0 auto 20px}
.stim .digits{font-family:var(--num);font-size:46px;font-weight:800;letter-spacing:.3em;color:var(--ink)}
.stim .words{font-size:30px;font-weight:700;letter-spacing:.15em;color:var(--ink)}
.stim .grid{display:grid;grid-template-columns:repeat(3,1fr);width:min(300px,100%);margin:0 auto;border:3px solid #111;background:#111;gap:3px}
.stim .grid div{background:#fff;aspect-ratio:1;padding:10%}
.cover{display:grid;place-items:center;height:120px;background:var(--ice);border-radius:12px;color:var(--navy);font-weight:700;margin-bottom:22px}
.cover .cnt{font-family:var(--num);font-size:34px;color:var(--blue)}
.series{font-family:var(--num);font-size:34px;font-weight:800;text-align:center;color:var(--ink);margin:4px 0 24px;letter-spacing:.06em}

.foot{display:flex;justify-content:space-between;align-items:center;margin-top:26px;font-size:13px;color:var(--sub)}
.foot .skip{color:var(--sub);text-decoration:underline}

.intro{text-align:center;padding:40px 20px}
.intro h1{font-size:32px;font-weight:900;color:var(--navy);margin:10px 0 12px}
.intro p{color:var(--sub);max-width:32em;margin:0 auto}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:28px 0}
.parts div{background:var(--ice);border-radius:12px;padding:16px 8px}
.parts b{display:block;font-family:var(--num);font-size:24px;color:var(--blue)}
.parts span{font-size:13px;color:var(--sub);font-weight:700}
@media(max-width:600px){.parts{grid-template-columns:repeat(2,1fr)}.prompt{font-size:18px}}

/* 開始前の記憶課題 */
.memo{text-align:center;padding:30px 20px}
.memo h2{font-size:24px;color:var(--navy);margin-bottom:8px}
.memo p{color:var(--sub);max-width:30em;margin:0 auto 24px}
.memo .box{background:var(--ice);border-radius:18px;padding:30px 20px;max-width:520px;margin:0 auto 22px}
.memo .box .digits{font-family:var(--num);font-size:52px;font-weight:900;letter-spacing:.3em;color:var(--navy)}
.memo .box .words{font-size:28px;font-weight:700;color:var(--navy);margin-top:14px;letter-spacing:.1em}
.memo .cnt{font-family:var(--num);color:var(--sub);font-size:14px;margin-top:10px}

.anal{text-align:center;padding:60px 24px}
.ring{width:110px;height:110px;margin:0 auto 24px;border-radius:50%;border:8px solid var(--ice);border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.anal h2{color:var(--navy);font-size:24px;margin-bottom:8px}
.anal p{color:var(--sub);min-height:28px}
</style>
</head>
<body>
<div class="qhd">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a4 4 0 0 1 4 4v1a4 4 0 0 1 2 7v1a4 4 0 0 1-6 3.5A4 4 0 0 1 6 16v-1a4 4 0 0 1 2-7V7a4 4 0 0 1 4-4z"/><path d="M12 3v18"/></svg></span>AI-KNOW<small>IQテスト</small></a>
    <div class="timer" id="timer" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span id="tm">20:00</span></div>
  </div>
  <div class="prog"><i id="prog" style="width:0%"></i></div>
</div>

<main class="stage" id="stage"></main>

<script src="matrix.js"></script>
<script>
/* ===================== 問題データ（planning.md §3 が正） ===================== */
var LIMIT = 1200; // 秒（20分）
var DOMAIN = { F: '図形推理', N: '数的推理', V: '言語・論理', M: '記憶', L: '長期記憶' };
var MEMO = { digits: '4 7 2 9', words: ['カモメ', '鍵', '灯台'] }; // 開始前に提示し、終盤で問う

// 図形（出題順1〜22。レベルはmatrix.jsのORDERに従う：L1=1点 L2=2点 L3=3点 L4=4点）
function F(n) { return { type: 'matrix', domain: 'F', n: n }; }
// 数的推理
var N = [
  { s: '2,  4,  6,  8,  10,  ?', o: ['11', '12', '14', '16'], a: 1, w: 1 },
  { s: '3,  5,  9,  17,  33,  ?', o: ['49', '57', '65', '66'], a: 2, w: 2 },
  { s: '1,  1,  2,  3,  5,  8,  13,  ?', o: ['18', '20', '21', '26'], a: 2, w: 2 },
  { s: '2,  6,  12,  20,  30,  ?', o: ['40', '42', '44', '48'], a: 1, w: 2 },
  { s: '100,  50,  52,  26,  28,  14,  ?', o: ['7', '12', '16', '30'], a: 2, w: 3 },
  { p: 'ある数を3倍して4を引くと、その数に8を足した数と等しくなります。ある数はいくつですか？', o: ['4', '5', '6', '8'], a: 2, w: 3 }
].map(function (q) { return { type: 'text', domain: 'N', w: q.w, prompt: q.p || '次の数列の「?」に入る数は？', series: q.s, options: q.o, answer: q.a }; });
// 言語・論理
var V = [
  { p: '「医者」と「病院」の関係に最も近いのは、「教師」と何の関係ですか？', o: ['生徒', '教科書', '学校', '授業'], a: 2, w: 1 },
  { p: '次のうち、仲間はずれはどれですか？', o: ['正方形', '長方形', 'ひし形', '三角形'], a: 3, w: 1 },
  { p: '「杞憂」の意味に最も近いものはどれですか？', o: ['先を見越した備え', '取り越し苦労', '根拠のある不安', '他人への気遣い'], a: 1, w: 2 },
  { p: '「すべてのAはBである。CはAではない。」このとき、確実に言えることはどれですか？', o: ['CはBではない', 'CはBである', 'CがBかどうかは決められない', 'BはAである'], a: 2, w: 2 },
  { p: '花子は太郎より年上です。太郎は次郎より年上です。次郎は花子より年下です。確実に言えることはどれですか？', o: ['次郎が3人の中で最年長', '花子が3人の中で最年長', '太郎が3人の中で最年少', '花子と次郎は同い年'], a: 1, w: 2 },
  { p: '「時計」が「時間」を測るなら、「温度計」が測るのは？', o: ['天気', '温度', '水銀', '湿度'], a: 1, w: 1 },
  { p: '友人を集まりに誘うと、相手は「<em>予定を確認して、前もって連絡するね</em>」と返事しました。1週間たっても、その話は出ません。<br>この返事に最も近い含意はどれですか？', o: ['本当に忙しく、まだ予定を調整しているので、もう一度聞くべきだ', '集まりにあまり乗り気ではないが、直接断りたくない', '忘れているだけなので、こちらから思い出させる必要がある', '集まりの日程を変えてほしいと暗に求めている'], a: 1, w: 3 },
  { p: '会議で、同僚Aがマネージャーから質問に答えるよう指名されました。Aが話す前に、同僚Bが割り込んでAの代わりに答えました。<br>職場の人間関係の規範から見ると、Bの行動にはどんな意味がありますか？', o: ['BはAを助けており、チームワークの一形態である', 'Bは親切で思いやりがある', 'Bの行動は、Aが自分で答える機会と自律性を奪っている', 'Bはマネージャーに評価されたいだけで、Aには影響がない'], a: 2, w: 3 }
].map(function (q) { return { type: 'text', domain: 'V', w: q.w, prompt: q.p, options: q.o, answer: q.a, left: true }; });
// 短期記憶（刺激を数秒表示→非表示）
var M1 = { type: 'memory', domain: 'M', w: 2, stim: { digits: '4 8 2 6 9 3' }, show: 5000, prompt: '表示された数字を逆の順に並べたものは？', options: ['3 9 6 2 8 4', '3 9 6 2 4 8', '4 8 2 6 3 9', '3 6 9 2 8 4'], answer: 0 };
var M2 = { type: 'memory', domain: 'M', w: 3, stim: { grid: [['sq'], ['x'], ['arcN'], ['dot@C'], ['tri0'], ['hl'], ['ci'], ['plus'], ['dia']] }, show: 5000, prompt: '右下にあった図形はどれですか？', foptions: [['ci'], ['dia'], ['hex'], ['sq']], answer: 1 };
// 長期記憶（開始前に提示した内容）
var L1 = { type: 'text', domain: 'L', w: 3, prompt: 'テスト開始前に表示された4桁の数字はどれですか？', options: ['4 7 2 9', '4 7 9 2', '7 4 2 9', '4 2 7 9'], answer: 0 };
var L2 = { type: 'text', domain: 'L', w: 3, prompt: 'テスト開始前に表示された3つの言葉に<b>含まれていなかった</b>ものはどれですか？', options: ['鍵', 'カモメ', '灯台', '港'], answer: 3, left: true };

// 出題順：図形と文章を交互に。図形はレベル順、文章も易→難
var QUESTIONS = [
  F(1), F(2), F(3), N[0], F(4), F(5), V[0], F(6), F(7), N[1],
  F(8), F(9), V[1], M1, F(10), F(11), N[2], F(12), V[5], L1,
  F(13), F(14), N[3], V[2], F(15), F(16), V[3], N[4], F(17), F(18),
  M2, F(19), V[4], N[5], F(20), V[6], F(21), L2, F(22), V[7]
];

/* ===================== 進行 ===================== */
var stage = document.getElementById('stage'), timerEl = document.getElementById('timer'), tmEl = document.getElementById('tm'), progEl = document.getElementById('prog');
var idx = 0, answers = [], timeLeft = LIMIT, tick = null, started = false, cache = {};
var LETTERS = 'ABCDEF';

function item(i) { var q = QUESTIONS[i]; if (q.type === 'matrix' && !cache[i]) cache[i] = MX.matrixItem(q.n); return cache[i]; }
function weight(i) { var q = QUESTIONS[i]; return q.type === 'matrix' ? item(i).level : q.w; }
function partLabel(i) {
  var q = QUESTIONS[i], d = q.domain, n = 0, total = 0;
  QUESTIONS.forEach(function (x, k) { if (x.domain === d) { total++; if (k <= i) n++; } });
  var lv = weight(i), dots = ''; for (var k = 1; k <= 4; k++) dots += '<i class="' + (k <= lv ? 'on' : '') + '"></i>';
  return '<span class="chip">' + DOMAIN[d] + ' ' + n + '/' + total + '</span><span>難易度</span><span class="lv">' + dots + '</span>';
}

function intro() {
  stage.innerHTML = '<div class="intro"><span class="eyebrow">AI-KNOW</span><h1>IQテスト</h1>' +
    '<p>40問・制限時間20分。図形の規則、数列、言語と論理、記憶の問題が交互に出題されます。易しい問題から始まり、少しずつ難しくなります。わからない問題は飛ばしても構いません。</p>' +
    '<div class="parts"><div><b>22</b><span>図形推理</span></div><div><b>6</b><span>数的推理</span></div><div><b>8</b><span>言語・論理</span></div><div><b>4</b><span>記憶</span></div></div>' +
    '<button class="btn btn-primary" id="start">テストを開始する <span class="arr">→</span></button>' +
    '<p style="font-size:12px;margin-top:16px">結果は心理測定上の標準化を行っていない推定値です。静かな環境で、途中で中断せずに受けてください。</p></div>';
  document.getElementById('start').onclick = memo;
}
// 開始前の記憶課題（最低8秒表示）
function memo() {
  stage.innerHTML = '<div class="memo"><span class="eyebrow">記憶課題</span><h2>次の内容を覚えてください</h2><p>テストの途中で、この内容について質問します。メモは取らずに覚えてください。</p>' +
    '<div class="box"><div class="digits">' + MEMO.digits + '</div><div class="words">' + MEMO.words.join('　') + '</div></div>' +
    '<button class="btn btn-primary" id="go" disabled style="opacity:.5">覚えました（<span id="mc">8</span>）</button><div class="cnt">8秒後にボタンが押せるようになります</div></div>';
  var c = 8, btn = document.getElementById('go');
  var iv = setInterval(function () { c--; document.getElementById('mc').textContent = c; if (c <= 0) { clearInterval(iv); btn.disabled = false; btn.style.opacity = 1; btn.innerHTML = 'テストを始める <span class="arr">→</span>'; } }, 1000);
  btn.onclick = function () { if (!btn.disabled) start(); };
}
function start() {
  started = true; timerEl.hidden = false;
  tick = setInterval(function () {
    timeLeft--; fmt();
    if (timeLeft <= 60) timerEl.classList.add('warn');
    if (timeLeft <= 0) { clearInterval(tick); finish(); }
  }, 1000);
  fmt(); show();
}
function fmt() { var m = Math.floor(timeLeft / 60), s = timeLeft % 60; tmEl.textContent = m + ':' + (s < 10 ? '0' : '') + s; }

function show() {
  var q = QUESTIONS[idx];
  progEl.style.width = (idx / QUESTIONS.length * 100) + '%';
  var h = '<div class="part">' + partLabel(idx) + '</div>';
  if (q.type === 'matrix') {
    var it = item(idx);
    h += '<div class="prompt">?に入る図形を選んでください</div>';
    h += '<div class="mat">' + it.cells.map(function (c) { return '<div>' + MX.drawCell(c) + '</div>'; }).join('') + '</div>';
    h += '<div class="sel-lbl">答えを選択</div>';
    h += '<div class="fopts" id="opts">' + it.options.map(function (o, i) { return '<button data-i="' + i + '"><b>' + LETTERS[i] + '</b>' + MX.drawCell(o) + '</button>'; }).join('') + '</div>';
  } else if (q.type === 'text') {
    h += '<div class="prompt' + (q.left ? ' left' : '') + '">' + q.prompt + '</div>';
    if (q.series) h += '<div class="series">' + q.series + '</div>';
    h += '<div class="topts" id="opts">' + q.options.map(function (o, i) { return '<button data-i="' + i + '"><b>' + LETTERS[i] + '</b><span>' + o + '</span></button>'; }).join('') + '</div>';
  } else {
    h += '<div class="prompt" id="prompt">次の内容を覚えてください</div><div class="stim" id="stim">';
    if (q.stim.digits) h += '<div class="digits">' + q.stim.digits + '</div>';
    if (q.stim.grid) h += '<div class="grid">' + q.stim.grid.map(function (c) { return '<div>' + MX.drawCell(c) + '</div>'; }).join('') + '</div>';
    h += '</div><div class="cover" id="cover" hidden><div>表示は終了しました<div class="cnt">?</div></div></div>';
    if (q.foptions) h += '<div class="fopts lock" id="opts" hidden>' + q.foptions.map(function (o, i) { return '<button data-i="' + i + '"><b>' + LETTERS[i] + '</b>' + MX.drawCell(o) + '</button>'; }).join('') + '</div>';
    else h += '<div class="topts lock" id="opts" hidden>' + q.options.map(function (o, i) { return '<button data-i="' + i + '"><b>' + LETTERS[i] + '</b><span>' + o + '</span></button>'; }).join('') + '</div>';
  }
  h += '<div class="foot"><span>' + (idx + 1) + ' / ' + QUESTIONS.length + '　キーボードの A〜F / 1〜6 でも選べます</span><button class="skip" id="skip">わからないので次へ</button></div>';
  stage.innerHTML = h;
  var opts = document.getElementById('opts');
  opts.querySelectorAll('button').forEach(function (b) { b.onclick = function () { pick(+b.dataset.i, b); }; });
  document.getElementById('skip').onclick = function () { pick(-1); };
  if (q.type === 'memory') {
    setTimeout(function () {
      var st = document.getElementById('stim'); if (st) st.remove();
      var cv = document.getElementById('cover'); if (cv) cv.hidden = false;
      document.getElementById('prompt').textContent = q.prompt;
      opts.classList.remove('lock'); opts.hidden = false;
    }, q.show);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function pick(i, btn) {
  if (btn) btn.classList.add('sel');
  answers[idx] = i;
  setTimeout(function () { idx++; if (idx >= QUESTIONS.length) finish(); else show(); }, btn ? 240 : 0);
}
document.addEventListener('keydown', function (e) {
  if (!started || idx >= QUESTIONS.length) return;
  var k = e.key.toUpperCase(), n = LETTERS.indexOf(k); if (n < 0) n = parseInt(e.key, 10) - 1;
  if (n >= 0 && n < 6) { var b = document.querySelector('#opts:not(.lock) button[data-i="' + n + '"]'); if (b) b.click(); }
});

/* ===================== 採点（planning.md §4） ===================== */
function erf(x) { var s = x < 0 ? -1 : 1; x = Math.abs(x); var t = 1 / (1 + .3275911 * x); var y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - .284496736) * t + .254829592) * t * Math.exp(-x * x); return s * y; }
function finish() {
  clearInterval(tick); idx = QUESTIONS.length; progEl.style.width = '100%';
  var raw = 0, max = 0, dom = { F: [0, 0], N: [0, 0], V: [0, 0], M: [0, 0] }, correct = 0, hardCorrect = 0, hardTotal = 0, longCorrect = 0;
  QUESTIONS.forEach(function (q, i) {
    var ans = q.type === 'matrix' ? item(i).answer : q.answer, w = weight(i), d = q.domain === 'L' ? 'M' : q.domain;
    var ok = answers[i] === ans;
    max += w; dom[d][1] += w;
    if (w >= 3) { hardTotal++; if (ok) hardCorrect++; }
    if (q.domain === 'L' && ok) longCorrect++;
    if (ok) { raw += w; dom[d][0] += w; correct++; }
  });
  var bonus = Math.min(4, Math.floor(Math.max(0, timeLeft) / 300));
  var score = raw + bonus, total = max + 4;
  var iq = Math.round(65 + score / total * 80);
  var pct = 0.5 * (1 + erf((iq - 100) / 15 / Math.SQRT2)) * 100;
  var d = {}; for (var k in dom) d[k] = dom[k][1] ? dom[k][0] / dom[k][1] : 0;
  localStorage.setItem('aiknow_iq_result', JSON.stringify({ iq: iq, pct: pct, raw: raw, max: max, bonus: bonus, correct: correct, hardCorrect: hardCorrect, hardTotal: hardTotal, longCorrect: longCorrect, n: QUESTIONS.length, timeLeft: timeLeft, used: LIMIT - timeLeft, domains: d, answers: answers, at: new Date().toISOString() }));
  analyzing();
}
function analyzing() {
  timerEl.hidden = true;
